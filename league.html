<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Matches | Smart Players Auction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        :root { --primary: #0284c7; --secondary: #fde047; --dark: #0f172a; --card-bg: #1e293b; }
        body { background-color: var(--dark); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Navbar */
        .navbar { padding: 15px 30px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .nav-brand { font-size: 20px; font-weight: 900; text-transform: uppercase; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;}
        .nav-brand img { height: 30px; }
        .nav-brand span { color: var(--secondary); }
        
        /* Action Buttons */
        .nav-actions { display: flex; gap: 15px; }
        .points-btn { background: #f59e0b; color: #0f172a; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 900; font-size: 13px; display: inline-flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border: none; cursor: pointer; text-transform: uppercase;}
        .admin-btn { background: #3b82f6; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* Split Screen Layout */
        .container { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; height: calc(100vh - 65px); }
        .split-grid { display: grid; gap: 20px; width: 100%; height: 100%; }
        
        .court-panel { background: var(--card-bg); border: 2px solid #334155; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .court-header { background: #0ea5e9; color: white; padding: 10px; text-align: center; font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
        
        .court-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        
        .live-indicator { color: #10b981; font-weight: 900; font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; animation: blink 1.5s infinite; }
        .pulse { width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .match-cat { color: #fde047; font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 25px; text-align: center; }
        
      .teams-split { display: flex; width: 100%; justify-content: space-between; align-items: stretch; gap: 10px; }
        
        .team-box { flex: 1; background: #0f172a; padding: 15px 10px; border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 2px 15px rgba(0,0,0,0.3); }
        .team-name { font-weight: 900; font-size: 18px; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; line-height: 1.1; word-wrap: break-word; width: 100%;}
        
        .player-names { font-size: 10px; color: #94a3b8; font-weight: 700; line-height: 1.3; min-height: 26px; display: flex; align-items: center; justify-content: center; text-transform: capitalize; margin-bottom: 8px; }
        
        .score-display { font-size: 34px; font-weight: 900; color: white; display: flex; align-items: baseline; gap: 4px; line-height: 1; }
        .score-label { font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; }
        
        .vs-wrapper { display: flex; align-items: center; justify-content: center; }
        .vs-badge { color: #94a3b8; font-size: 14px; font-weight: 900; background: #1e293b; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; }
        .court-footer { background: #0f172a; padding: 12px 20px; border-top: 1px solid #334155; font-size: 14px; display: flex; align-items: center; gap: 10px;}
        .queue-badge { background: #475569; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        /* Points Table Modal */
        #pointsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 800px; width: 90%; border: 1px solid #334155; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/index.html" class="nav-brand">
            <img src="/spa-logo.png.png" alt="Logo">
            Smart <span>Players</span> Auction
        </a>
        
        <div class="nav-actions">
            <!-- Points Table Button -->
            <button onclick="togglePointsModal()" class="points-btn">🏆 Franchise Points Table</button>
            <!-- Organizer Hub Button -->
          <a href="league-admin.html" class="admin-btn" id="organizerBtn" style="display: none;">⚙️ Organizer Hub</a>
        </div>
    </nav>
    
    <div class="container">
        <!-- Split Screen Grid -->
        <div id="splitCourtsGrid" class="split-grid"></div>
    </div>

    <!-- Points Table Modal -->
    <div id="pointsModal">
        <div class="modal-content">
            <h2 style="color: #fde047; text-align: center; margin-bottom: 20px; font-size: 28px; text-transform: uppercase; font-weight: 900;">Franchise Standings</h2>
            <p style="text-align: center; color: #94a3b8; margin-bottom: 30px;">Points data will be mapped here from your Organizer Hub settings.</p>
            
            <!-- Placeholder Table until you set points in admin -->
           <table style="width: 100%; border-collapse: collapse; text-align: left; background: #0f172a; border-radius: 8px; overflow: hidden;">
                <thead style="background: #334155; color: white;">
                    <tr>
                        <th style="padding: 15px;">Rank</th>
                        <th style="padding: 15px;">Franchise Name</th>
                        <th style="padding: 15px; text-align: center;">Matches</th>
                        <th style="padding: 15px; text-align: center;">Points</th>
                    </tr>
                </thead>
                <tbody id="standingsTableBody">
                    <!-- Teams will load here automatically -->
                </tbody>
            </table>

            <div style="text-align: center; margin-top: 30px;">
                <button onclick="togglePointsModal()" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Close Table</button>
            </div>
        </div>
    </div>

    <script>
      window.onload = async function() {
            // Reveal Organizer button ONLY if the user is logged in
            if (localStorage.getItem('isAdmin') === 'true') {
                const orgBtn = document.getElementById('organizerBtn');
                if (orgBtn) orgBtn.style.display = 'inline-flex';
            }

            loadPublicMatches();
            setInterval(loadPublicMatches, 5000); // Polls silently every 5 seconds for real-time dashboard updates
        };
      function togglePointsModal() {
            const modal = document.getElementById('pointsModal');
            if (modal.style.display === 'none' || modal.style.display === '') {
                populateStandings();
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

       function populateStandings() {
            const tbody = document.getElementById('standingsTableBody');
            if (!tbody) return;
            
            let teams = [];
            let fixtures = [];
            // Default configuration if the organizer hasn't saved one yet
            let config = { pattern: 'overall_tie', tieWin: 2, tieLoss: 0, gameWin: 1, gameDraw: 0 };

            try { teams = JSON.parse(localStorage.getItem('auctionTeams') || '[]'); } catch(e) {}
            try { fixtures = JSON.parse(localStorage.getItem('leagueManualFixtures') || '[]'); } catch(e) {}
            try { 
                let savedConfig = JSON.parse(localStorage.getItem('leaguePointsConfig'));
                if (savedConfig) config = savedConfig;
            } catch(e) {}

            if (teams.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding: 15px; text-align: center; color: #94a3b8;">No teams registered yet.</td></tr>';
                return;
            }

            // 1. Setup base stats for all teams
            let stats = {};
            teams.forEach(t => {
                let name = t.name.toUpperCase();
                stats[name] = { matches: 0, points: 0 };
            });

            // 2. CALCULATE POINTS BASED ON ORGANIZER'S CHOSEN PATTERN
            if (config.pattern === 'per_game') {
                fixtures.forEach(f => {
                    let tA = (f.teamA || '').toUpperCase();
                    let tB = (f.teamB || '').toUpperCase();
                    let setsA = parseInt(f.setsA) || 0;
                    let setsB = parseInt(f.setsB) || 0;

                    if (setsA > 0 || setsB > 0) { // Only count if the match has started/finished
                        if (stats[tA]) stats[tA].matches++;
                        if (stats[tB]) stats[tB].matches++;

                        if (setsA > setsB) {
                            if (stats[tA]) stats[tA].points += config.gameWin;
                        } else if (setsB > setsA) {
                            if (stats[tB]) stats[tB].points += config.gameWin;
                        } else if (setsA === setsB) {
                            if (stats[tA]) stats[tA].points += config.gameDraw;
                            if (stats[tB]) stats[tB].points += config.gameDraw;
                        }
                    }
                });
            } else {
                // Pattern A: Overall Tie Logic
                let matchups = {};
                fixtures.forEach(f => {
                    let tA = (f.teamA || '').toUpperCase();
                    let tB = (f.teamB || '').toUpperCase();
                    if (!tA || !tB || tA === 'TBA' || tB === 'TBA') return;

                    // Group all category matches into one overall tie between the two teams
                    let key = [tA, tB].sort().join('_VS_');
                    if (!matchups[key]) matchups[key] = { team1: tA, team2: tB, t1Wins: 0, t2Wins: 0, played: false };

                    let setsA = parseInt(f.setsA) || 0;
                    let setsB = parseInt(f.setsB) || 0;

                    if (setsA > setsB) {
                        if (matchups[key].team1 === tA) matchups[key].t1Wins++; else matchups[key].t2Wins++;
                        matchups[key].played = true;
                    } else if (setsB > setsA) {
                        if (matchups[key].team1 === tB) matchups[key].t1Wins++; else matchups[key].t2Wins++;
                        matchups[key].played = true;
                    }
                });

                for (let key in matchups) {
                    let m = matchups[key];
                    if (m.played) {
                        if (stats[m.team1]) stats[m.team1].matches++;
                        if (stats[m.team2]) stats[m.team2].matches++;

                        // Award points to the franchise who won the majority of the categories
                        if (m.t1Wins > m.t2Wins) {
                            if (stats[m.team1]) stats[m.team1].points += config.tieWin;
                            if (stats[m.team2]) stats[m.team2].points += config.tieLoss;
                        } else if (m.t2Wins > m.t1Wins) {
                            if (stats[m.team2]) stats[m.team2].points += config.tieWin;
                            if (stats[m.team1]) stats[m.team1].points += config.tieLoss;
                        }
                    }
                }
            }

            // 3. Sort the final table by points
            let sortedTeams = teams.map(t => {
                let name = t.name.toUpperCase();
                return { name: name, matches: stats[name].matches, points: stats[name].points };
            }).sort((a, b) => b.points - a.points);

            // 4. Output the table
            let html = '';
            sortedTeams.forEach((team, index) => {
                let rankColor = index === 0 ? '#fde047' : (index === 1 ? '#cbd5e1' : '#b45309');
                if(index > 2) rankColor = '#94a3b8';
                
                html += `
                <tr style="border-bottom: 1px solid #334155;">
                    <td style="padding: 15px; font-weight: bold; color: ${rankColor};">${index + 1}</td>
                    <td style="padding: 15px; font-weight: bold;">${team.name}</td>
                    <td style="padding: 15px; text-align: center; color: #94a3b8;">${team.matches}</td>
                    <td style="padding: 15px; text-align: center; font-weight: bold; color: #10b981;">${team.points}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        async function loadPublicMatches() {
            let fixtures = [];
            
            try {
                const res = await fetch('/api/fixtures');
                if(res.ok) fixtures = await res.json();
            } catch(err) {}

            if(!Array.isArray(fixtures) || fixtures.length === 0) {
                try {
                    fixtures = JSON.parse(localStorage.getItem('leagueManualFixtures') || '[]');
                } catch(e) {}
            }

            let courtCount = parseInt(localStorage.getItem('leagueCourtCount')) || 6;
            const grid = document.getElementById('splitCourtsGrid');
            
            if (courtCount === 1) grid.style.gridTemplateColumns = '1fr';
            else if (courtCount === 2) grid.style.gridTemplateColumns = '1fr 1fr';
            else if (courtCount === 3 || courtCount === 4) grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
            else grid.style.gridTemplateColumns = 'repeat(3, 1fr)';

            grid.innerHTML = '';

            for(let i = 1; i <= courtCount; i++) {
                let cName = `COURT ${i}`;
                let courtFixtures = fixtures.filter(f => f.court === cName);
                let activeMatch = courtFixtures.length > 0 ? courtFixtures[0] : null;
                let queue = courtFixtures.slice(1);

                let panelHtml = `
                <div class="court-panel">
                    <div class="court-header">${cName}</div>
                    <div class="court-body">`;

                if(activeMatch) {
                    // Extract player names (handling doubles) and default to 'TBA' if not selected yet
                    let pA = activeMatch.playerA1 ? activeMatch.playerA1 : 'Players TBA';
                    if(activeMatch.playerA2) pA += ` & ${activeMatch.playerA2}`;
                    
                    let pB = activeMatch.playerB1 ? activeMatch.playerB1 : 'Players TBA';
                    if(activeMatch.playerB2) pB += ` & ${activeMatch.playerB2}`;
                    
                    // Extract live points
                    let scoreA = activeMatch.scoreA !== undefined ? activeMatch.scoreA : '0';
                    let scoreB = activeMatch.scoreB !== undefined ? activeMatch.scoreB : '0';

                    panelHtml += `
                        <div class="live-indicator"><div class="pulse"></div> LIVE NOW</div>
                        <div class="match-cat">${activeMatch.category}</div>
                        
                        <div class="teams-split">
                            <div class="team-box" style="border-bottom: 4px solid #ef4444;">
                                <div class="team-name" style="color: #ef4444;">${activeMatch.teamA}</div>
                                <div class="player-names">${pA}</div>
                                <div class="score-display">${scoreA} <span class="score-label">PTS</span></div>
                            </div>
                            
                            <div class="vs-wrapper"><div class="vs-badge">VS</div></div>
                            
                            <div class="team-box" style="border-bottom: 4px solid #3b82f6;">
                                <div class="team-name" style="color: #3b82f6;">${activeMatch.teamB}</div>
                                <div class="player-names">${pB}</div>
                                <div class="score-display">${scoreB} <span class="score-label">PTS</span></div>
                            </div>
                        </div>
                    `;
                } else {
                    panelHtml += `<div style="color: #475569; font-weight: bold; font-size: 20px; text-transform: uppercase;">Awaiting Players</div>`;
                }

                panelHtml += `</div>`;

                if(queue.length > 0) {
                    let nextMatch = queue[0];
                    panelHtml += `
                    <div class="court-footer">
                        <span class="queue-badge">UP NEXT</span>
                        <strong style="color: #eab308; font-size: 12px; margin-left: 10px;">${nextMatch.category}</strong>
                        <span style="color: #cbd5e1; font-size: 12px; margin-left: 6px;">(${nextMatch.teamA} vs ${nextMatch.teamB})</span>
                        ${queue.length > 1 ? `<span style="color: #64748b; font-size: 11px; margin-left: auto;">+${queue.length - 1} more</span>` : ''}
                    </div>`;
                } else {
                    panelHtml += `<div class="court-footer" style="justify-content: center; color: #475569; font-size: 12px; font-weight: bold;">Queue is empty</div>`;
                }

                panelHtml += `</div>`;
                grid.innerHTML += panelHtml;
            }
        }
    </script>
</body>
</html>
