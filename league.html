<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Matches | Smart Players Auction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        :root { --primary: #0284c7; --secondary: #fde047; --dark: #0f172a; --card-bg: #1e293b; }
        body { background-color: var(--dark); color: white; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navbar */
        .navbar { padding: 20px 40px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-size: 22px; font-weight: 900; text-transform: uppercase; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;}
        .nav-brand img { height: 35px; }
        .nav-brand span { color: var(--secondary); }
        
        /* Main Layout */
        .container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .header p { color: #94a3b8; font-size: 16px; margin-top: 10px; }
        
        /* Grid & Cards */
        .match-grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px; }
        .match-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; overflow: hidden;}
        .court-badge { background: #0ea5e9; color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;}
        
        /* Status Indicators */
        .status-badge { color: #10b981; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .status-queue { color: #94a3b8; font-size: 12px; font-weight: bold; }
        .pulse { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        /* Teams Layout */
        .team-box { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #475569; margin-top: 20px; }
        .team-name { font-weight: 900; font-size: 18px; width: 42%; text-align: center; word-wrap: break-word; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/index.html" class="nav-brand">
            <img src="/spa-logo.png.png" alt="Logo">
            Smart <span>Players</span> Auction
        </a>
        </nav>
    
    <div class="container">
        <div class="header">
            <h1>Live <span>Matches</span></h1>
            <p>Public Match-Day Hub & Live Court Summaries</p>
        </div>
        
        <!-- The cards will be generated inside this grid -->
        <div id="publicMatchesGrid" class="match-grid"></div>
    </div>

    <script>
        window.onload = async function() {
            loadPublicMatches();
            // Automatically silently refresh the page data every 10 seconds to catch new organizer assignments
            setInterval(loadPublicMatches, 10000); 
        };

        async function loadPublicMatches() {
            let fixtures = [];
            
            // 1. Fetch live queue from MongoDB
            try {
                const res = await fetch('/api/fixtures');
                if(res.ok) fixtures = await res.json();
            } catch(err) {
                console.warn("Could not fetch cloud fixtures");
            }

            // 2. Hybrid Fallback (In case Cloud is unreachable)
            if(!Array.isArray(fixtures) || fixtures.length === 0) {
                try {
                    fixtures = JSON.parse(localStorage.getItem('leagueManualFixtures') || '[]');
                } catch(e) {}
            }

            const grid = document.getElementById('publicMatchesGrid');
            grid.innerHTML = '';

            // Empty State
            if(fixtures.length === 0) {
                grid.innerHTML = `
                <div style="text-align: center; color: #94a3b8; width: 100%; padding: 50px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; max-width: 600px;">
                    <h2 style="color: white; margin-bottom: 10px;">No Matches Currently Assigned</h2>
                    <p>Matches will appear here as soon as the tournament organizer queues them up.</p>
                </div>`;
                return;
            }

            let courtTracker = {};

            // Render Match Cards
            fixtures.forEach((f, index) => {
                if(!courtTracker[f.court]) courtTracker[f.court] = 0;
                courtTracker[f.court]++;
                
                let isFirst = courtTracker[f.court] === 1;
                
                // Apply 'Live' styling to the 1st match on a court, and 'Queue' styling to the rest
                let statusHtml = isFirst 
                    ? `<div class="status-badge"><div class="pulse"></div> ON COURT</div>`
                    : `<div class="status-queue">⏳ IN QUEUE (#${courtTracker[f.court]})</div>`;
                    
                let borderHighlight = isFirst ? 'border-top: 4px solid #10b981;' : 'border-top: 4px solid #475569; opacity: 0.8;';

                grid.innerHTML += `
                <div class="match-card" style="${borderHighlight}">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <span class="court-badge">${f.court}</span>
                        ${statusHtml}
                    </div>
                    <h3 style="color: #fde047; font-size: 16px; text-transform: uppercase;">${f.category}</h3>
                    
                    <div class="team-box">
                        <div class="team-name" style="color: #ef4444;">${f.teamA}</div>
                        <div style="color: #94a3b8; font-size: 12px; font-weight: bold;">VS</div>
                        <div class="team-name" style="color: #3b82f6;">${f.teamB}</div>
                    </div>
                </div>
                `;
            });
        }
    </script>
</body>
</html>
