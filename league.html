<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Umpire Scoreboard | BWF Official Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; overflow: auto; }
        
        .scoreboard { 
            background: #111; border: 2px solid #333; border-radius: 12px; width: 100%; max-width: 1000px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 20px; 
        }
        
        /* Header section */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #fde047; margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900;}
        .badges { display: flex; gap: 8px; }
        .cat-badge { background: #222; color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; border: 1px solid #444;}
        .court-badge { background: #0ea5e9; color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; }

        /* Umpire Display Banner */
        #umpireNameDisplay {
            text-align: center; color: #10b981; font-size: clamp(12px, 2.5vw, 16px); 
            font-weight: 900; margin-top: -10px; margin-bottom: 15px; 
            text-transform: uppercase; letter-spacing: 2px; display: none;
        }

        /* Team Rows */
        .team-row { 
            display: flex; align-items: stretch; background: #1a1a1a; margin-bottom: 15px; 
            border-radius: 8px; border-left: 8px solid #555; overflow: hidden;
        }
        .team-a { border-left-color: #e11d48; }
        .team-b { border-left-color: #2563eb; }

        /* Left Side: Info & Players */
        .team-info { flex: 1; padding: 15px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .team-name { font-size: clamp(16px, 3vw, 24px); font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-select { 
            background: #000; color: #fff; border: 1px solid #444; padding: 8px; margin-bottom: 6px; 
            width: 100%; border-radius: 4px; font-size: 12px; font-weight: 600; outline: none; appearance: none;
        }

        /* Middle: Scores */
        .scores-area { display: flex; align-items: center; background: #0f0f0f; padding: 0 15px; border-left: 2px solid #222; border-right: 2px solid #222;}
        
        .game-col { text-align: center; margin-right: 15px; }
        .col-label { display: block; font-size: 10px; color: #888; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; letter-spacing: 1px;}
        .game-box { 
            background: #000; border: 2px solid #444; color: #fde047; font-size: clamp(24px, 4vw, 35px); 
            font-weight: 900; width: clamp(40px, 8vw, 60px); height: clamp(40px, 8vw, 60px); display: flex; justify-content: center; align-items: center; border-radius: 6px; 
        }

        .point-col { text-align: center; }
        .point-box { color: #fff; font-size: clamp(50px, 10vw, 90px); font-weight: 900; width: clamp(70px, 15vw, 120px); text-align: center; line-height: 1; font-variant-numeric: tabular-nums;}

        /* Right Side: Umpire Controls */
        .controls { display: flex; flex-direction: column; padding: 10px; gap: 6px; justify-content: center; background: #111; width: clamp(100px, 15vw, 140px);}
        .controls button { 
            border: none; font-weight: 900; cursor: pointer; border-radius: 6px; 
            text-transform: uppercase; transition: 0.1s; width: 100%;
        }
        .controls button:active { transform: scale(0.95); }
        .btn-pt { background: #10b981; color: white; padding: 12px 5px; font-size: clamp(14px, 2vw, 18px); flex-grow: 1;}
        .btn-game { background: #fde047; color: #000; padding: 8px 5px; font-size: clamp(10px, 1.5vw, 12px); }
        .btn-sub { background: #333; color: white; padding: 8px 5px; font-size: clamp(10px, 1.5vw, 12px); }

        /* Footer */
        .footer-actions { text-align: center; margin-top: 15px; }
        .end-btn { 
            background: #ef4444; color: white; border: none; padding: 12px 30px; font-size: clamp(12px, 2vw, 16px); 
            font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        /* Mobile Landscape Optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .scoreboard { padding: 10px; }
            .header { margin-bottom: 10px; padding-bottom: 10px; }
            .header h1 { font-size: 16px; }
            .cat-badge, .court-badge { font-size: 10px; padding: 4px 8px; }
            #umpireNameDisplay { margin-top: -5px; margin-bottom: 10px; }
            .team-row { margin-bottom: 8px; border-left-width: 5px; }
            .team-info { padding: 10px; }
            .team-name { font-size: 14px; margin-bottom: 5px; }
            .player-select { font-size: 11px; padding: 6px; margin-bottom: 4px; }
            .game-box { width: 35px; height: 35px; font-size: 20px; }
            .point-box { width: 70px; font-size: 50px; }
            .controls { width: 100px; padding: 5px; gap: 4px; }
            .btn-pt { padding: 8px 5px; font-size: 14px; }
            .btn-game, .btn-sub { padding: 5px 2px; font-size: 9px; }
            .footer-actions { margin-top: 10px; }
            .end-btn { padding: 10px 20px; font-size: 12px; }
        }

        /* Portrait Warning */
        @media (orientation: portrait) {
            body::before {
                content: "⚠️ PLEASE ROTATE YOUR PHONE TO LANDSCAPE";
                display: block; position: absolute; top: 10px; left: 0; width: 100%; text-align: center; 
                color: #fde047; font-weight: 900; font-size: 12px; z-index: 100;
            }
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        
        <div class="header">
            <h1 id="boardSportTitle">BWF OFFICIAL SCORING</h1>
            <div class="badges">
                <span class="cat-badge" id="matchCategory">Loading Data...</span>
                <span class="court-badge" id="matchCourt">Loading...</span>
            </div>
        </div>

        <div id="umpireNameDisplay"></div>

        <!-- TEAM A -->
        <div class="team-row team-a">
            <div class="team-info">
                <div class="team-name" id="dashTeamA" style="color: #e11d48;">TEAM A</div>
                <select class="player-select" id="playerA1"><option value="">Select Player 1...</option></select>
                <select class="player-select" id="playerA2"><option value="">Select Player 2 (If Doubles)...</option></select>
            </div>
            
            <div class="scores-area">
                <div class="game-col">
                    <span class="col-label">Games</span>
                    <div class="game-box" id="setsA">0</div>
                </div>
                <div class="point-col">
                    <span class="col-label">Points</span>
                    <div class="point-box" id="scoreA">0</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-pt" onclick="modScore('A', 'pts', 1)">+ POINT</button>
                <button class="btn-game" onclick="modScore('A', 'sets', 1)">+ GAME</button>
                <button class="btn-sub" onclick="modScore('A', 'pts', -1)">- 1 Point</button>
            </div>
        </div>

        <!-- TEAM B -->
        <div class="team-row team-b">
            <div class="team-info">
                <div class="team-name" id="dashTeamB" style="color: #38bdf8;">TEAM B</div>
                <select class="player-select" id="playerB1"><option value="">Select Player 1...</option></select>
                <select class="player-select" id="playerB2"><option value="">Select Player 2 (If Doubles)...</option></select>
            </div>
            
            <div class="scores-area">
                <div class="game-col">
                    <span class="col-label">Games</span>
                    <div class="game-box" id="setsB">0</div>
                </div>
                <div class="point-col">
                    <span class="col-label">Points</span>
                    <div class="point-box" id="scoreB">0</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-pt" onclick="modScore('B', 'pts', 1)">+ POINT</button>
                <button class="btn-game" onclick="modScore('B', 'sets', 1)">+ GAME</button>
                <button class="btn-sub" onclick="modScore('B', 'pts', -1)">- 1 Point</button>
            </div>
        </div>

        <div class="footer-actions">
            <button class="end-btn" onclick="endMatch()">END MATCH & SUBMIT RESULTS</button>
        </div>
        
    </div>

    <script>
        let matchState = { scoreA: 0, scoreB: 0, setsA: 0, setsB: 0 };

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const courtName = urlParams.get('court') || 'COURT 1';
            const umpireName = urlParams.get('umpire'); 
            
            document.getElementById('matchCourt').innerText = courtName;
            document.getElementById('boardSportTitle').innerText = `SPORTS OFFICIAL SCORING`;

            // Display Umpire Name if it was passed through the QR code URL
            if (umpireName) {
                const umpDisplay = document.getElementById('umpireNameDisplay');
                umpDisplay.innerText = `Match Umpire: ${umpireName}`;
                umpDisplay.style.display = 'block';
            }

            let manualFixtures = [];
            let allPlayers = [];

            try {
                // 1. Try to fetch from MongoDB Server
                const fixtureRes = await fetch('/api/fixtures');
                if (fixtureRes.ok) manualFixtures = await fixtureRes.json();
                
                const playerRes = await fetch('/api/players/sold');
                if (playerRes.ok) allPlayers = await playerRes.json();
            } catch (err) {
                console.warn("Could not reach Cloud DB, checking local backup...");
            }

            // 2. Hybrid Fallback (In case user didn't click "Save & Publish" to cloud yet)
            if (manualFixtures.length === 0) {
                manualFixtures = JSON.parse(localStorage.getItem('leagueManualFixtures') || '[]');
            }
            if (allPlayers.length === 0) {
                allPlayers = JSON.parse(localStorage.getItem('auctionPlayers') || '[]');
            }

            let match = manualFixtures.find(f => String(f.court).trim() === String(courtName).trim());
            let tA = "Team A", tB = "Team B";
            
            if(match) {
                document.getElementById('matchCategory').innerText = match.category;
                document.getElementById('dashTeamA').innerText = match.teamA;
                document.getElementById('dashTeamB').innerText = match.teamB;
                tA = match.teamA;
                tB = match.teamB;
            } else {
                document.getElementById('matchCategory').innerText = "No Match Assigned";
            }

            populateRosterDropdowns(tA, tB, allPlayers);
        };

        function populateRosterDropdowns(teamA, teamB, allPlayers) {
            let teamARoster = allPlayers.filter(p => 
                p.status === 'sold' && 
                (String(p.teamName).toLowerCase() === String(teamA).toLowerCase() || String(p.soldToTeamId) === String(teamA))
            );
            
            let teamBRoster = allPlayers.filter(p => 
                p.status === 'sold' && 
                (String(p.teamName).toLowerCase() === String(teamB).toLowerCase() || String(p.soldToTeamId) === String(teamB))
            );

            let buildOptions = (roster) => {
                let html = `<option value="">Select Player...</option>`;
                roster.forEach(p => html += `<option value="${p.name}">${p.name} (${p.category})</option>`);
                return html;
            };

            document.getElementById('playerA1').innerHTML = buildOptions(teamARoster);
            document.getElementById('playerA2').innerHTML = buildOptions(teamARoster);
            document.getElementById('playerB1').innerHTML = buildOptions(teamBRoster);
            document.getElementById('playerB2').innerHTML = buildOptions(teamBRoster);
        }

        function modScore(team, type, amt) {
            if (team === 'A') {
                if (type === 'pts') matchState.scoreA = Math.min(30, Math.max(0, matchState.scoreA + amt));
                if (type === 'sets') matchState.setsA = Math.max(0, matchState.setsA + amt);
                document.getElementById('scoreA').innerText = matchState.scoreA;
                document.getElementById('setsA').innerText = matchState.setsA;
            } else {
                if (type === 'pts') matchState.scoreB = Math.min(30, Math.max(0, matchState.scoreB + amt));
                if (type === 'sets') matchState.setsB = Math.max(0, matchState.setsB + amt);
                document.getElementById('scoreB').innerText = matchState.scoreB;
                document.getElementById('setsB').innerText = matchState.setsB;
            }
        }

        function endMatch() { 
            let pA1 = document.getElementById('playerA1').value;
            let pB1 = document.getElementById('playerB1').value;

            if(!pA1 || !pB1) {
                if(!confirm("Warning: You haven't selected the playing players for both teams. Submit anyway?")) return;
            }

            if(confirm(`Are you sure you want to end this match?\n\nTeam A: ${matchState.setsA} Games (${matchState.scoreA} Pts)\nTeam B: ${matchState.setsB} Games (${matchState.scoreB} Pts)`)) {
                alert("Match results securely synced!");
                window.close();
                window.location.href = "league.html";
            }
        }
    </script>
</body>
</html>
