<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire Scoreboard | Smart Players Auction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .board-container { width: 100%; max-width: 1300px; background: #fff; color: #000; border-radius: 8px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); overflow-x: auto; }
        
        .header-info { text-align: center; margin-bottom: 30px; }
        .header-info h2 { margin: 0 0 10px 0; text-transform: uppercase; font-weight: 900; font-size: 24px; color: #000; }
        .badge { background: #0f172a; color: #fff; padding: 5px 12px; border-radius: 4px; font-size: 16px; margin: 0 5px; display: inline-block; font-weight: bold;}
        
        .score-table { border-collapse: collapse; margin-bottom: 40px; width: 100%; background: white; color: black; }
        .score-table td { border: 2px solid black; text-align: center; font-weight: bold; height: 40px; }
        
        .team-label { 
            font-size: 18px; 
            width: 300px; 
            text-align: left !important; 
            vertical-align: bottom;
            padding-left: 5px; 
            padding-bottom: 2px;
            border-top: none !important; 
            border-left: none !important; 
            border-right: none !important; 
            border-bottom: 2px solid black !important;
            text-transform: uppercase;
        }
        
        .num-cell { width: 30px; font-size: 14px; background: #f8fafc; }
        
        .input-cell { padding: 0; border: 2px solid black; border-left: 2px solid black !important; }
        .input-cell select { 
            width: 100%; 
            height: 100%; 
            border: none; 
            outline: none; 
            font-size: 14px; 
            padding: 0 5px; 
            font-weight: bold; 
            background: transparent; 
            cursor: pointer;
        }
        
        .mark-cell { cursor: pointer; color: #dc2626; font-size: 22px; user-select: none; }
        .mark-cell:hover { background: #f1f5f9; }

        .action-footer { margin-top: 10px; text-align: center; }
        .end-btn { padding: 15px 35px; font-size: 16px; background: #10b981; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="board-container">
        
        <div class="header-info">
            <h2 id="boardSportTitle">LIVE SCORING</h2>
            <div>
                <span class="badge" id="matchCategory">Loading Category...</span>
                <span class="badge" style="background: #38bdf8; color: #000;" id="matchCourt">Loading Court...</span>
            </div>
        </div>

        <div id="tableContainer">
            <!-- Tables injected by JavaScript -->
        </div>

        <div class="action-footer">
            <button class="end-btn" onclick="endMatch()">END MATCH & SUBMIT RESULTS</button>
        </div>
        
    </div>

    <script>
        const MAX_POINTS = 30;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const courtName = urlParams.get('court') || 'COURT 1';
            
            document.getElementById('matchCourt').innerText = courtName;

            let setup = JSON.parse(localStorage.getItem('auctionSetup') || '{}');
            let sport = setup.sportsType || 'SPORTS';
            document.getElementById('boardSportTitle').innerText = `${sport} LIVE SCORE SHEET`;

            let manualFixtures = JSON.parse(localStorage.getItem('leagueManualFixtures') || '[]');
            let match = manualFixtures.find(f => String(f.court).trim() === String(courtName).trim());

            let tA = "TEAM A", tB = "TEAM B";
            
            if(match) {
                document.getElementById('matchCategory').innerText = match.category;
                tA = match.teamA;
                tB = match.teamB;
            } else {
                document.getElementById('matchCategory').innerText = "No Match Assigned";
            }

            renderTables(tA, tB);
            populateRosterDropdowns(tA, tB);
        };

        function renderTables(teamA, teamB) {
            let container = document.getElementById('tableContainer');
            container.innerHTML = generateTableHTML('A', teamA) + generateTableHTML('B', teamB);
        }

        function generateTableHTML(id, teamName) {
            let html = `<table class="score-table"><tr><td class="team-label">${teamName}</td>`;
            
            // Top Row (Numbers 1 to 30)
            for(let i = 1; i <= MAX_POINTS; i++) {
                html += `<td class="num-cell">${i}</td>`;
            }
            html += `</tr><tr><td class="input-cell"><select id="player${id}1"><option value="">Select Player...</option></select></td>`;
            
            // Player 1 Mark Cells
            for(let i = 1; i <= MAX_POINTS; i++) {
                html += `<td class="mark-cell" onclick="toggleX(this)"></td>`;
            }
            html += `</tr><tr><td class="input-cell"><select id="player${id}2"><option value="">Select Player...</option></select></td>`;
            
            // Player 2 Mark Cells
            for(let i = 1; i <= MAX_POINTS; i++) {
                html += `<td class="mark-cell" onclick="toggleX(this)"></td>`;
            }
            html += `</tr></table>`;
            
            return html;
        }

        function toggleX(cell) {
            if (cell.innerText === 'X') {
                cell.innerText = '';
            } else {
                cell.innerText = 'X';
            }
        }

        function populateRosterDropdowns(teamA, teamB) {
            let allPlayers = JSON.parse(localStorage.getItem('auctionPlayers') || '[]');
            
            // Filters only by team name, removing the category restriction
            let teamARoster = allPlayers.filter(p => p.status === 'sold' && String(p.teamName).toLowerCase() === String(teamA).toLowerCase());
            let teamBRoster = allPlayers.filter(p => p.status === 'sold' && String(p.teamName).toLowerCase() === String(teamB).toLowerCase());

            let buildOptions = (roster) => {
                let html = `<option value="">Select Player...</option>`;
                roster.forEach(p => html += `<option value="${p.name}">${p.name} (${p.category})</option>`);
                return html;
            };

            document.getElementById('playerA1').innerHTML = buildOptions(teamARoster);
            document.getElementById('playerA2').innerHTML = buildOptions(teamARoster);
            document.getElementById('playerB1').innerHTML = buildOptions(teamBRoster);
            document.getElementById('playerB2').innerHTML = buildOptions(teamBRoster);
        }

        function endMatch() { 
            let pA1 = document.getElementById('playerA1').value;
            let pB1 = document.getElementById('playerB1').value;

            if(!pA1 || !pB1) {
                if(!confirm("Warning: You haven't selected players for both teams. Submit anyway?")) return;
            }

            if(confirm(`Are you sure you want to end this match and sync the final results?`)) {
                alert("Match results securely synced!");
                window.close();
                window.location.href = "league.html";
            }
        }
    </script>
</body>
</html>
