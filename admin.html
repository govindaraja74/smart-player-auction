<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Room | Smart Players Auction</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #1b263b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 6px; border: none; font-size: 16px; }
        button { background-color: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="login-box" id="loginSection">
        <h2>Admin Portal</h2>
        <p>Enter Master Password</p>
        <input type="password" id="adminPassword" placeholder="Enter Password">
        <button onclick="checkPassword()">Access Control Room</button>
        <p id="errorMessage" style="color: #ff4d4d; display: none; margin-top: 15px;">Incorrect password.</p>
    </div>

    <!-- Hidden Control Room (Shows only after login) -->
    <div id="controlRoom" style="display: none; padding: 30px; text-align: center;">
        <h1>Control Room</h1>
        <p>Welcome to the dashboard. Bidding controls and team rosters will go here.</p>
        <button onclick="window.location.href='/'" style="background-color: #dc3545; width: auto; margin-top: 20px;">Log Out</button>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "MasterUnlock2026") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('controlRoom').style.display = 'block';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }
    </script>
</body>
</html>
