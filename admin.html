<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Room | Smart Players Auction</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-box { background-color: #1b263b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        .dashboard { width: 100%; max-width: 1100px; padding: 20px; display: none; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .panel { background-color: #1b263b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; width: auto; padding: 10px 20px; }
        .btn-warning { background-color: #f59e0b; }
        .btn-primary { background-color: #0284c7; }
        h1, h2 { margin-top: 0; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-box" id="loginSection">
        <h2>Admin Portal</h2>
        <p>Enter Master Password</p>
        <input type="password" id="adminPassword" placeholder="Enter Password">
        <button onclick="checkPassword()">Access Control Room</button>
        <p id="errorMessage" style="color: #ff4d4d; display: none; margin-top: 15px;">Incorrect password.</p>
    </div>

    <!-- Hidden Control Room -->
    <div class="dashboard" id="controlRoom">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Auction Room</h1>
            <button class="btn-danger" onclick="window.location.href='/'">Log Out</button>
        </div>

        <!-- Game Selector Section -->
        <div class="panel" style="margin-top: 15px; background-color: #374151;">
            <h2>Step 1: Select Tournament Game</h2>
            <select id="selectedGame" onchange="filterByGame()">
                <option value="Badminton">Badminton</option>
                <option value="Table Tennis">Table Tennis</option>
                <option value="Volleyball">Volleyball</option>
                <option value="Cricket Tennis">Cricket Tennis</option>
            </select>
        </div>

        <div class="grid-container">
            <!-- Create Franchise with Logo Panel -->
            <div class="panel">
                <h2>Step 2: Create Franchise</h2>
                <input type="text" id="teamName" placeholder="Team Name">
                <input type="text" id="teamLogo" placeholder="Logo Image URL (Link to image)">
                <input type="number" id="teamBudget" placeholder="Starting Budget (₹)">
                <button onclick="addTeam()" style="margin-top: 10px;">Add Team</button>
            </div>

            <!-- Smart Player Form Generator & Google Forms Link -->
            <div class="panel">
                <h2>Step 3: Player Registration</h2>
                <p style="font-size: 14px; color: #94a3b8;">Link Google Forms or add players manually.</p>
                <input type="text" id="gFormLink" placeholder="Paste Google Form Link Here">
                <button class="btn-primary" onclick="saveFormLink()" style="margin-top: 5px;">Save Registration Link</button>
                <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
                <input type="text" id="playerName" placeholder="Player Name">
                <input type="number" id="playerBasePrice" placeholder="Base Price (₹)">
                <button class="btn-primary" onclick="addPlayer()" style="margin-top: 5px;">Add Player Manually</button>
            </div>

            <!-- Live Auction Panel -->
            <div class="panel">
                <h2>Step 4: Live Player Draft</h2>
                <select id="playerSelect">
                    <option value="">Loading Players...</option>
                </select>
                <select id="teamSelect">
                    <option value="">Loading Franchises...</option>
                </select>
                <input type="number" id="winningBid" placeholder="Sold Price (₹)">
                <button class="btn-warning" onclick="sellPlayer()" style="margin-top: 10px;">Sell Player!</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('joinRoom', 'KBL2026');

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "MasterUnlock2026") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('controlRoom').style.display = 'block';
                loadDashboard(); 
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                
                window.allPlayers = data.players || [];
                window.allTeams = data.teams || [];
                filterByGame();
            } catch (err) {
                console.error("Dashboard failed to load", err);
            }
        }

        function filterByGame() {
            const currentGame = document.getElementById('selectedGame').value;
            
            const playerSelect = document.getElementById('playerSelect');
            playerSelect.innerHTML = '<option value="">Select a Player...</option>';
            window.allPlayers.filter(p => !p.game || p.game === currentGame).forEach(p => {
                playerSelect.innerHTML += `<option value="${p._id}">${p.name} (Base: ₹${p.basePrice})</option>`;
            });

            const teamSelect = document.getElementById('teamSelect');
            teamSelect.innerHTML = '<option value="">Select a Team...</option>';
            window.allTeams.filter(t => !t.game || t.game === currentGame).forEach(t => {
                teamSelect.innerHTML += `<option value="${t._id}">${t.name} (Purse: ₹${t.purseRemaining})</option>`;
            });
        }

        async function addTeam() {
            const name = document.getElementById('teamName').value;
            const logoUrl = document.getElementById('teamLogo').value;
            const budget = document.getElementById('teamBudget').value;
            const game = document.getElementById('selectedGame').value;
            
            if(!name || !budget) return alert("Please enter team name and budget!");
            
            await fetch('/api/franchises', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, logoUrl, budget, game, tournamentId: 'KBL2026' })
            });
            
            alert(name + " added successfully for " + game + "!");
            document.getElementById('teamName').value = '';
            document.getElementById('teamLogo').value = '';
            document.getElementById('teamBudget').value = '';
            loadDashboard(); 
        }

        async function addPlayer() {
            const name = document.getElementById('playerName').value;
            const basePrice = document.getElementById('playerBasePrice').value;
            const game = document.getElementById('selectedGame').value;
            
            if(!name || !basePrice) return alert("Enter player name and base price!");
            
            await fetch('/api/players/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, basePrice, game, tournamentId: 'KBL2026' })
            });
            
            alert(name + " added to the " + game + " player pool!");
            document.getElementById('playerName').value = '';
            document.getElementById('playerBasePrice').value = '';
            loadDashboard();
        }

        function saveFormLink() {
            const link = document.getElementById('gFormLink').value;
            if(!link) return alert("Please paste a valid Google Form link.");
            alert("Google Form integration link saved successfully!");
        }

        function sellPlayer() {
            const playerId = document.getElementById('playerSelect').value;
            const teamId = document.getElementById('teamSelect').value;
            const soldPrice = document.getElementById('winningBid').value;
            
            if(!playerId || !teamId || !soldPrice) return alert("Select player, team, and bid price!");
            
            socket.emit('adminSellPlayer', { playerId, teamId, soldPrice: Number(soldPrice), tournamentId: 'KBL2026' });
            document.getElementById('winningBid').value = '';
            setTimeout(loadDashboard, 500);
        }

        socket.on('alert', (msg) => { alert(msg); });
        socket.on('bidError', (msg) => { alert("Error: " + msg); });
    </script>
</body>
</html>
