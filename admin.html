<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Room | Smart Players Auction</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-box { background-color: #1b263b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        .dashboard { width: 100%; max-width: 1000px; padding: 20px; display: none; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .panel { background-color: #1b263b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; width: auto; padding: 10px 20px; }
        .btn-warning { background-color: #f59e0b; }
        .btn-warning:hover { background-color: #d97706; }
        h1, h2 { margin-top: 0; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-box" id="loginSection">
        <h2>Admin Portal</h2>
        <p>Enter Master Password</p>
        <input type="password" id="adminPassword" placeholder="Enter Password">
        <button onclick="checkPassword()">Access Control Room</button>
        <p id="errorMessage" style="color: #ff4d4d; display: none; margin-top: 15px;">Incorrect password.</p>
    </div>

    <!-- Hidden Control Room (Shows only after login) -->
    <div class="dashboard" id="controlRoom">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Tournament Control Room</h1>
            <button class="btn-danger" onclick="window.location.href='/'">Log Out</button>
        </div>

        <div class="grid-container">
            <!-- Manage Teams Panel -->
            <div class="panel">
                <h2>Create Franchise</h2>
                <input type="text" id="teamName" placeholder="Team Name (e.g., Karkala Smashers)">
                <input type="number" id="teamBudget" placeholder="Starting Budget (₹)">
                <button onclick="alert('Database connection pending!')" style="margin-top: 10px;">Add Team</button>
            </div>

            <!-- Live Auction Panel -->
            <div class="panel">
                <h2>Live Player Draft</h2>
                <p>Select Player & Winning Bid</p>
                <select id="playerSelect">
                    <option>Loading Registered Players...</option>
                </select>
                <select id="teamSelect">
                    <option>Loading Franchises...</option>
                </select>
                <input type="number" id="winningBid" placeholder="Sold Price (₹)">
                <button class="btn-warning" onclick="alert('Database connection pending!')" style="margin-top: 10px;">Sell Player!</button>
            </div>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "MasterUnlock2026") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('controlRoom').style.display = 'block';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }
    </script>
</body>
</html>
