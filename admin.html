<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Room | Smart Players Auction</title>
    <!-- Adds Excel & PDF Powers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { background-color: #1b263b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 1200px; }
        .hidden { display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .panel { background-color: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #94a3b8; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: none; font-size: 15px; box-sizing: border-box; background-color: #f8fafc; color: black; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        .btn-danger { background-color: #dc3545; width: auto; padding: 10px 20px; margin-top: 0; }
        .btn-warning { background-color: #f59e0b; }
        .btn-primary { background-color: #0284c7; }
        h1, h2, h3 { margin-top: 0; text-align: center; color: #f8fafc; }
        .header-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 15px; }
        .header-bar h1 { text-align: left; margin: 0; font-size: 24px; }
        .header-bar .logo-container { display: flex; justify-content: center; }
        .header-bar .btn-container { display: flex; justify-content: flex-end; }
        .dynamic-box { background-color: #0d1b2a; padding: 15px; margin-top: 15px; border-radius: 8px; border: 1px solid #334155; }
        .team-row { border: 1px solid #334155; background-color: #1b263b; padding: 10px; margin-top: 10px; border-radius: 8px; display: flex; align-items: center; gap: 15px; }
        .team-row img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background-color: white; }
        .team-info { flex-grow: 1; }
        .team-actions button { width: auto; padding: 8px 12px; margin: 0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 1. Login Screen -->
    <div class="box" id="loginSection" style="max-width: 400px;">
        <h2>Admin Portal</h2>
        <input type="password" id="adminPassword" placeholder="Enter Password">
        <button onclick="checkPassword()">Access System</button>
        <p id="errorMessage" style="color: #ff4d4d; display: none; text-align: center;">Incorrect password.</p>
    </div>

    <!-- 2. Auction Setup Room -->
    <div class="box hidden" id="setupRoom">
        <h1>Auction Setup Room</h1>
        <form id="setupForm" onsubmit="submitSetup(event)">
            <div class="grid-2">
                <div><label>Auction Name *</label><input type="text" id="setupName" required></div>
                <div><label>Season *</label><input type="text" id="setupSeason" required></div>
                <div><label>Auction Logo Upload</label><input type="file" id="setupLogo" accept="image/*"></div>
                <div><label>Auction Date *</label><input type="date" id="setupDate" required></div>
                <div><label>Budget Per Team (₹) *</label><input type="number" id="setupBudget" required></div>
                <div><label>Minimum Bid (₹) *</label><input type="number" id="setupMinBid" required></div>
                <div><label>Bid Increase (₹) *</label><input type="number" id="setupBidIncrease" required></div>
                <div><label>Max Players Per Team *</label><input type="number" id="setupMaxPlayers" required></div>
            </div>
            <button type="submit" class="btn-primary">Save & Open Control Room</button>
        </form>
    </div>

    <!-- 3. Control Room -->
    <div class="box hidden" id="controlRoom">
        <div class="header-bar">
            <div><h1 id="displayTournamentName">Control Room</h1></div>
            <div class="logo-container"><img id="displayTournamentLogo" src="" style="display: none; height: 75px; border-radius: 8px;"></div>
            <div class="btn-container"><button class="btn-danger" onclick="window.location.reload()">End Session</button></div>
        </div>

        <!-- Categories Section -->
        <div class="panel" style="background-color: #374151;">
            <h2>Select Game & Categories</h2>
            <select id="selectedGame" onchange="filterByGame()">
                <option value="Badminton">Badminton</option>
                <option value="Table Tennis">Table Tennis</option>
                <option value="Volleyball">Volleyball</option>
                <option value="Cricket Tennis">Cricket Tennis</option>
            </select>
            <hr style="border: 0; border-top: 1px solid #475569; margin: 15px 0;">
            <label>Number of Categories</label>
            <input type="number" id="numOfCategories" min="1" placeholder="e.g., 3" oninput="generateCategoryInputs()">
            <div id="categoryInputsContainer"></div>
            <button id="saveCatBtn" class="btn-primary" onclick="saveCategories()" style="display:none; margin-top: 10px;">Save Categories</button>
        </div>

        <div class="grid-container">
            <!-- Manage Teams Panel -->
            <div class="panel">
                <h2>Manage Franchises</h2>
                <label>Number of Teams to Add</label>
                <input type="number" id="numOfTeams" min="1" oninput="generateTeamInputs()">
                <div id="teamInputsContainer"></div>
                <button id="addTeamBtn" onclick="addMultipleTeams()">Add All Teams</button>
                <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
                <h3>Active Teams</h3>
                <div id="activeTeamsList"><p style="color: #94a3b8; font-size: 14px; text-align: center;">No teams added yet.</p></div>
            </div>

            <!-- Import Players Panel -->
            <div class="panel">
                <h2>Import Players</h2>
                <label>1. Import via Google Forms (Sheets Link)</label>
                <input type="text" id="gSheetLink" placeholder="Paste Public Google Sheets link">
                <button class="btn-primary" id="gSheetBtn" onclick="importFromGoogleSheet()" style="margin-top: 5px;">Import from Link</button>
                
                <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
                <label>2. Upload Excel/CSV File</label>
                <input type="file" id="excelFile" accept=".csv, .xlsx" style="padding: 5px;">
                <button style="background-color: #10b981; margin-top: 5px;" onclick="importExcelPlayers()">Upload File</button>
                
                <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
                <label>3. Add Manually:</label>
                <input type="text" id="playerName" placeholder="Player Name">
                <input type="number" id="playerBasePrice" placeholder="Base Price (₹)">
                <select id="playerCategoryManual"><option value="">Select Category (Optional)</option></select>
                <button class="btn-primary" onclick="addPlayer()">Add Player</button>
            </div>

            <!-- Live Player Draft Panel -->
            <div class="panel">
                <h2>Live Player Draft</h2>
                <select id="draftCategoryFilter" onchange="filterByGame()" style="background-color: #0284c7; color: white;">
                    <option value="All">All Categories</option>
                </select>
                <select id="playerSelect"><option value="">Loading Players...</option></select>
                <select id="teamSelect"><option value="">Loading Franchises...</option></select>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="number" id="winningBid" placeholder="Sold Price (₹)">
                    <button type="button" class="btn-primary" id="quickBidBtn" onclick="applyBidIncrease()" style="width: 50%;">+ Bid</button>
                </div>
                <button class="btn-warning" onclick="sellPlayer()">Finalize Sale!</button>
            </div>
            
            <!-- Player Database & PDF Section -->
            <div class="panel" style="grid-column: 1 / -1; margin-top: 20px;">
                <h2>Players Database</h2>
                <button class="btn-primary" onclick="downloadPDF()" style="width: 250px; margin-bottom: 20px;">📥 Download as PDF</button>
                <div id="playersListContainer" style="background: white; color: black; padding: 20px; border-radius: 8px; overflow-x: auto;">
                    <!-- Table injects here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('joinRoom', 'KBL2026');
        let currentBidIncrease = 0;
        window.currentCategories = [];

        // AUTO-FILL MEMORY FUNCTION
        function loadSavedMemory() {
            const savedSetup = JSON.parse(localStorage.getItem('auctionSetup') || '{}');
            if(savedSetup.name) document.getElementById('setupName').value = savedSetup.name;
            if(savedSetup.season) document.getElementById('setupSeason').value = savedSetup.season;
            if(savedSetup.date) document.getElementById('setupDate').value = savedSetup.date;
            if(savedSetup.budget) document.getElementById('setupBudget').value = savedSetup.budget;
            if(savedSetup.minBid) document.getElementById('setupMinBid').value = savedSetup.minBid;
            if(savedSetup.bidInc) document.getElementById('setupBidIncrease').value = savedSetup.bidInc;
            if(savedSetup.maxPlayers) document.getElementById('setupMaxPlayers').value = savedSetup.maxPlayers;
            
            const savedCats = JSON.parse(localStorage.getItem('auctionCats') || '[]');
            if(savedCats.length > 0) {
                document.getElementById('numOfCategories').value = savedCats.length;
                generateCategoryInputs();
                savedCats.forEach((cat, i) => {
                    document.getElementById('catName_'+(i+1)).value = cat;
                });
                setTimeout(saveCategories, 500); 
            }
        }

        function checkPassword() {
            if (document.getElementById('adminPassword').value === "MasterUnlock2026") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('setupRoom').classList.remove('hidden');
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        function submitSetup(event) {
            event.preventDefault(); 
            
            // SAVE TO BROWSER MEMORY
            localStorage.setItem('auctionSetup', JSON.stringify({
                name: document.getElementById('setupName').value,
                season: document.getElementById('setupSeason').value,
                date: document.getElementById('setupDate').value,
                budget: document.getElementById('setupBudget').value,
                minBid: document.getElementById('setupMinBid').value,
                bidInc: document.getElementById('setupBidIncrease').value,
                maxPlayers: document.getElementById('setupMaxPlayers').value
            }));

            currentBidIncrease = Number(document.getElementById('setupBidIncrease').value);
            document.getElementById('quickBidBtn').innerText = `+ ₹${currentBidIncrease}`;
            document.getElementById('displayTournamentName').innerText = `${document.getElementById('setupName').value} Control Room`;

            const logoInput = document.getElementById('setupLogo');
            if (logoInput.files && logoInput.files[0]) {
                document.getElementById('displayTournamentLogo').src = URL.createObjectURL(logoInput.files[0]);
                document.getElementById('displayTournamentLogo').style.display = 'block'; 
            }

            document.getElementById('setupRoom').classList.add('hidden');
            document.getElementById('controlRoom').classList.remove('hidden');
            loadDashboard(); 
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                window.allPlayers = data.players || [];
                window.allTeams = data.teams || [];
                filterByGame();
                renderTeamsList();
                renderPlayersDatabase(); 
            } catch (err) { console.error(err); }
        }

        function generateCategoryInputs() {
            const num = parseInt(document.getElementById('numOfCategories').value) || 0;
            const container = document.getElementById('categoryInputsContainer');
            container.innerHTML = ''; 
            document.getElementById('saveCatBtn').style.display = num > 0 ? 'block' : 'none';
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<div class="dynamic-box"><input type="text" id="catName_${i}" placeholder="Category ${i} Name (e.g., Group A)"></div>`;
            }
        }

        async function saveCategories() {
            const num = parseInt(document.getElementById('numOfCategories').value) || 0;
            window.currentCategories = [];
            let memArray = [];
            
            for(let i=1; i<=num; i++) {
                const name = document.getElementById('catName_'+i).value;
                if(name) { 
                    window.currentCategories.push({ name: name }); 
                    memArray.push(name); 
                }
            }
            
            // SAVE CATEGORIES TO BROWSER MEMORY
            localStorage.setItem('auctionCats', JSON.stringify(memArray)); 
            
            const manualDropdown = document.getElementById('playerCategoryManual');
            const filterDropdown = document.getElementById('draftCategoryFilter');
            manualDropdown.innerHTML = '<option value="">Select Category (Optional)</option>';
            filterDropdown.innerHTML = '<option value="All">All Categories</option>';
            
            window.currentCategories.forEach(cat => {
                manualDropdown.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
                filterDropdown.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
            });
        }

        // EXCEL AND FORMS IMPORTERS (ACCEPTS ALL COLUMNS)
        async function processPlayerRow(p, game) {
            let normalizedPlayer = {
                ...p, 
                name: p.Name || p.name || p.Player || p['Player Name'],
                basePrice: p.BasePrice || p.baseprice || p.Price || p['Base Price'],
                category: p.Category || p.category || '',
                game: game,
                tournamentId: 'KBL2026'
            };
            if (normalizedPlayer.name && normalizedPlayer.basePrice) {
                await fetch('/api/players/register', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(normalizedPlayer) 
                });
            }
        }

        async function importFromGoogleSheet() { 
            const link = document.getElementById('gSheetLink').value;
            const game = document.getElementById('selectedGame').value;
            if (!link.includes('spreadsheets/d/')) return alert("Invalid link.");
            document.getElementById('gSheetBtn').innerText = "Importing...";
            try {
                const sheetId = link.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/)[1];
                const response = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`);
                const workbook = XLSX.read(await response.text(), {type: 'string'});
                const playersArray = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                for (let p of playersArray) await processPlayerRow(p, game);
                alert("Players imported successfully!");
                loadDashboard();
            } catch (err) { alert(err.message); }
            document.getElementById('gSheetBtn').innerText = "Import from Link";
        }

        async function importExcelPlayers() {
            const file = document.getElementById('excelFile').files[0];
            const game = document.getElementById('selectedGame').value;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const playersArray = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type: 'array'}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type: 'array'}).SheetNames[0]]);
                for (let p of playersArray) await processPlayerRow(p, game);
                alert("File imported successfully!");
                loadDashboard();
            };
            reader.readAsArrayBuffer(file);
        }

        async function addPlayer() {
            const nameInput = document.getElementById('playerName');
            const priceInput = document.getElementById('playerBasePrice');
            const catInput = document.getElementById('playerCategoryManual');
            
            if(!nameInput.value || !priceInput.value) return alert("Please enter a player name and base price.");

            await fetch('/api/players/register', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    name: nameInput.value, 
                    basePrice: priceInput.value, 
                    category: catInput.value, 
                    game: document.getElementById('selectedGame').value 
                }) 
            });
            
            // CLEARS THE BOXES AFTER ADDING
            nameInput.value = '';
            priceInput.value = '';
            catInput.value = '';
            
            loadDashboard();
        }

        // DYNAMIC PDF DATABASE RENDERER
        function renderPlayersDatabase() {
            const container = document.getElementById('playersListContainer');
            const currentGame = document.getElementById('selectedGame').value;
            const gamePlayers = window.allPlayers.filter(p => !p.game || p.game === currentGame);
            
            if(gamePlayers.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>No players registered for this game yet.</p>";
                return;
            }

            const grouped = {};
            gamePlayers.forEach(p => {
                const cat = p.category || 'Uncategorized';
                if(!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(p);
            });

            const tName = document.getElementById('setupName').value || 'Auction';
            let html = `<div id="pdf-content" style="padding: 20px; background: white; color: black; font-family: Arial, sans-serif;">
                        <h1 style="text-align: center; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px;">${tName} - Player Pool</h1>`;
            
            for(let cat in grouped) {
                html += `<h3 style="background: #0284c7; color: white; padding: 10px; margin-top: 25px; border-radius: 4px;">Category: ${cat}</h3>`;
                html += `<table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">`;
                
                let excludeKeys = ['_id', '__v', 'tournamentId', 'game', 'status'];
                let allKeys = new Set();
                grouped[cat].forEach(p => { Object.keys(p).forEach(k => { if(!excludeKeys.includes(k)) allKeys.add(k); }); });
                let keysArr = Array.from(allKeys);
                
                keysArr = keysArr.filter(k => k !== 'name' && k !== 'basePrice' && k !== 'category');
                keysArr.unshift('name', 'basePrice', 'category');

                html += `<tr style="background: #f1f5f9;">`;
                keysArr.forEach(k => { html += `<th style="border: 1px solid #cbd5e1; padding: 10px; text-transform: uppercase;">${k}</th>`; });
                html += `<th style="border: 1px solid #cbd5e1; padding: 10px;">STATUS</th></tr>`;
                
                grouped[cat].forEach(p => {
                    html += `<tr>`;
                    keysArr.forEach(k => { 
                        html += `<td style="border: 1px solid #cbd5e1; padding: 10px;">${p[k] !== undefined ? p[k] : '-'}</td>`; 
                    });
                    html += `<td style="border: 1px solid #cbd5e1; padding: 10px; font-weight: bold; color: ${p.status === 'sold' ? '#16a34a' : '#94a3b8'};">${p.status.toUpperCase()}</td></tr>`;
                });
                html += `</table>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            const opt = {
              margin:       0.5,
              filename:     'Auction_Players_List.pdf',
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2 },
              jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' } 
            };
            html2pdf().set(opt).from(element).save();
        }

        // TEAMS AND BIDDING LOGIC
        function renderTeamsList() {
            const currentGame = document.getElementById('selectedGame').value;
            const container = document.getElementById('activeTeamsList');
            container.innerHTML = '';
            const filteredTeams = window.allTeams.filter(t => !t.game || t.game === currentGame);
            if (filteredTeams.length === 0) return container.innerHTML = '<p style="color: #94a3b8; font-size: 14px; text-align: center;">No teams added yet.</p>';
            filteredTeams.forEach(t => {
                const logoHtml = t.logoUrl ? `<img src="${t.logoUrl}">` : `<div style="width:50px;height:50px;border-radius:50%;background:#334155;"></div>`;
                container.innerHTML += `<div class="team-row">${logoHtml}<div class="team-info"><strong style="font-size: 16px;">${t.name}</strong><br><span style="font-size: 12px; color: #38bdf8;">Budget: ₹${t.purseRemaining}</span></div>
                    <div class="team-actions"><button class="btn-primary" onclick="editTeam('${t._id}', '${t.name}', ${t.purseRemaining})">Edit</button> <button class="btn-danger" onclick="deleteTeam('${t._id}')">Delete</button></div></div>`;
            });
        }

        function filterByGame() {
            const currentGame = document.getElementById('selectedGame').value;
            const currentCat = document.getElementById('draftCategoryFilter').value;
            const playerSelect = document.getElementById('playerSelect');
            playerSelect.innerHTML = '<option value="">Select a Player...</option>';
            window.allPlayers.filter(p => (!p.game || p.game === currentGame) && (currentCat === "All" || p.category === currentCat)).forEach(p => {
                playerSelect.innerHTML += `<option value="${p._id}">${p.name} [${p.category || 'N/A'}] (Base: ₹${p.basePrice})</option>`;
            });
            const teamSelect = document.getElementById('teamSelect');
            teamSelect.innerHTML = '<option value="">Select a Team...</option>';
            window.allTeams.filter(t => !t.game || t.game === currentGame).forEach(t => {
                teamSelect.innerHTML += `<option value="${t._id}">${t.name} (Purse: ₹${t.purseRemaining})</option>`;
            });
            renderTeamsList();
            renderPlayersDatabase();
        }

        async function editTeam(id, oldName, oldBudget) {
            const newName = prompt("Enter new team name:", oldName); if (!newName) return;
            const newBudget = prompt("Enter new budget (₹):", oldBudget); if (!newBudget) return;
            await fetch(`/api/franchises/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: newName, purseRemaining: Number(newBudget), budget: Number(newBudget) }) });
            loadDashboard();
        }

        async function deleteTeam(id) {
            if (!confirm("Delete this team?")) return;
            await fetch(`/api/franchises/${id}`, { method: 'DELETE' });
            loadDashboard();
        }

        function generateTeamInputs() {
            const num = parseInt(document.getElementById('numOfTeams').value) || 0;
            const container = document.getElementById('teamInputsContainer');
            container.innerHTML = ''; 
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<div class="dynamic-box"><h4>Team ${i}</h4><input type="text" id="tName_${i}" placeholder="Enter Team Name"><label style="font-size: 13px; margin-top: 10px;">Upload Team Logo</label><input type="file" id="tLogo_${i}" accept="image/*" style="padding: 5px;"></div>`;
            }
        }

        async function addMultipleTeams() {
            const num = parseInt(document.getElementById('numOfTeams').value) || 0;
            const game = document.getElementById('selectedGame').value;
            const budget = document.getElementById('setupBudget').value; 
            if(num === 0) return;
            const btn = document.getElementById('addTeamBtn'); btn.innerText = "Uploading..."; btn.disabled = true;
            for(let i=1; i<=num; i++) {
                const name = document.getElementById('tName_'+i).value;
                const logoInput = document.getElementById('tLogo_'+i);
                if(!name) continue;
                let logoDataUrl = "";
                if (logoInput && logoInput.files[0]) {
                    logoDataUrl = await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(logoInput.files[0]); });
                }
                await fetch('/api/franchises', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, logoUrl: logoDataUrl, budget: Number(budget), purseRemaining: Number(budget), game, tournamentId: 'KBL2026' }) });
            }
            document.getElementById('numOfTeams').value = ''; document.getElementById('teamInputsContainer').innerHTML = '';
            btn.innerText = "Add All Teams"; btn.disabled = false;
            loadDashboard(); 
        }

        function applyBidIncrease() {
            let currentBid = Number(document.getElementById('winningBid').value);
            document.getElementById('winningBid').value = currentBid === 0 ? Number(document.getElementById('setupMinBid').value) : currentBid + currentBidIncrease;
        }

        function sellPlayer() {
            socket.emit('adminSellPlayer', { playerId: document.getElementById('playerSelect').value, teamId: document.getElementById('teamSelect').value, soldPrice: Number(document.getElementById('winningBid').value), tournamentId: 'KBL2026' });
            setTimeout(loadDashboard, 500);
        }

        // TRIGGER MEMORY ON PAGE LOAD
        setTimeout(loadSavedMemory, 500);

    </script>
</body>
</html>
